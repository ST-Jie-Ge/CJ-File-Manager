android.useAndroidX=true
android.enableJetifier=true
# Pure Java crypto has no support-library references. Leave multi-release JARs untouched.
android.jetifier.ignorelist=bcprov-jdk18on-1.86.jar,bcpkix-jdk18on-1.86.jar,bcutil-jdk18on-1.86.jar,bctls-jdk18on-1.86.jar
# Required by AGP 9 optimized resource shrinking; Java code must not switch on R IDs.
android.nonFinalResIds=true
# R8 采用「非 full mode」：保守的默认保留策略（更接近传统 ProGuard 行为），
# 对反射/序列化/工厂加载等场景宽容度更高。代价是体积略大，但换来更可预测的运行结果。
android.enableR8.fullMode=false
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
